<script>
function mascaraData(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    if (v.length >= 5) {
        input.value = `${v.slice(0, 2)}/${v.slice(2, 4)}/${v.slice(4)}`;
    } else if (v.length >= 3) {
        input.value = `${v.slice(0, 2)}/${v.slice(2)}`;
    } else {
        input.value = v;
    }
}

const tabela = {
  A:1, J:1, I:1, Q:1, Y:1, B:2, K:2, R:2, C:3, G:3, L:3, S:3,
  D:4, M:4, T:4, E:5, H:5, N:5, U:6, V:6, W:6, X:6, Ç:6, O:7, Z:7, F:8, P:8
};

const vogais = ["A","E","I","O", "Y", "U"];

function calcularValorComAcentos(letra){
  const base = letra.normalize("NFD")[0];
  const valorBase = tabela[base];
  if(!valorBase) return 0;

  let soma = 0;
  let mult = 1;

  for(let c of letra.normalize("NFD")){
    if(c === "\u0301") soma += 2;
    else if(c === "\u0302") soma += 7;
    else if(c === "\u0303") soma += 3;
    else if(c === "\u0327") soma += 3;
    else if(c === "\u0300") mult *= 2;
    else if(c === "\u0308") mult *= 2;
  }
  return (valorBase + soma) * mult;
}

function reduzir(n){
  n = Math.abs(n);
  while(n > 9){
    n = n.toString().split("").reduce((a,b)=>a+Number(b),0);
  }
  return n;
}

function calcularAnoPessoal(data){
  if(!data || data.length < 10) return 0;
  const [dia, mes, ano] = data.split("/").map(Number);
  const anoAtual = new Date().getFullYear();
  return reduzir(reduzir(dia) + reduzir(mes) + reduzir(anoAtual));
}  

let dados1 = null;
let dados2 = null;

function calcularPessoa(nome, data){
  nome = nome.toUpperCase();
  let somaV=0, somaC=0;
  let valores=[];

  for(let l of nome){
    const valor = calcularValorComAcentos(l);
    if(!valor) continue;
    valores.push(reduzir(valor));
    const base = l.normalize("NFD")[0];
    if(vogais.includes(base)) somaV += valor;
    else somaC += valor;
  }

  const motivacao = reduzir(somaV);
  const influencia = reduzir(somaC);
  const personality = reduzir(somaV+somaC);
  let caminho=0, proposito=0;

  if(data && data.length === 10){
    const [dia, mes, ano] = data.split("/").map(Number);
    caminho = reduzir(dia+mes+ano);
    proposito = reduzir(caminho+personality);
  }
  return { motivacao, influencia, personalidade: personality, caminho, proposito, harmonia: proposito, valores };
}

function gerarPiramide(valores, elementoPiramide, elementoRegente){
  let numerosSequencias = [];
  if(!valores || valores.length === 0){
    elementoPiramide.innerHTML=""; elementoRegente.innerHTML=""; return;
  }

  let lines = [valores.map(Number)];
  while(lines[lines.length-1].length > 1){
    let anterior = lines[lines.length-1];
    let nova = [];
    for(let i=0;i<anterior.length-1;i++){
      nova.push(Number(reduzir(anterior[i] + anterior[i+1])));
    }
    lines.push(nova);
  }

  let marcacoes = [];
  for(let l=0; l<lines.length; l++){
    marcacoes[l] = new Set();
    let linha = lines[l];
    let i=0;
    while(i < linha.length){
      let atual = Number(linha[i]);
      let count = 1; let j = i+1;
      while(j < linha.length && Number(linha[j]) === atual) { count++; j++; }
      if(count >= 3){
        for(let k=i; k<i+count; k++) marcacoes[l].add(k);
      }
      i += count;
    }
  }

  let html="";
  for(let l=0; l<lines.length; l++){
    html += lines[l].map((n,idx)=>{
      if (marcacoes[l].has(idx)){
        if (!numerosSequencias.includes(n)) numerosSequencias.push(n);
        return `<span class="negativo">${n}</span>`;
      }
      return n;
    }).join(" ") + "<br>";
  }

  elementoPiramide.innerHTML = html;
  const regente = lines[lines.length - 1][0];

  elementoRegente.innerHTML = `
    <div class="botoes-piramide">
      <button onclick="abrirModalRegente(textos.regente[${regente}], '${elementoRegente.id}')">Regente: ${regente}</button>
      <button onclick="mostrarSequenciaNegativa('${elementoRegente.id}')">Sequência Negativa</button>
    </div>
  `;

  if (elementoRegente.id === "regente1") { dados1.regente = regente; dados1.sequenciaNegativa = numerosSequencias; }
  if (elementoRegente.id === "regente2") { dados2.regente = regente; dados2.sequenciaNegativa = numerosSequencias; }
  if (elementoRegente.id === "regenteBebe") { dadosBebe.regente = regente; dadosBebe.sequenciaNegativa = numerosSequencias; }

  if (elementoRegente.id === "regenteBebe") {
    const resultado = document.getElementById("resultadoBebe");
    resultado.innerHTML = (!numerosSequencias || numerosSequencias.length === 0) ? "✅ Este nome é harmônico." : "❌ Este nome possui sequência negativa.";
  }
}

function chaveSinastria(a,b){
  return `${Math.min(a,b)}-${Math.max(a,b)}`;
}

function mostrarSinastria(){
  if(!dados1 || !dados2) return;
  const nome1 = document.getElementById("social1").value || document.getElementById("nome1").value;
  const nome2 = document.getElementById("social2").value || document.getElementById("nome2").value;
  const chave = chaveSinastria(dados1.proposito, dados2.proposito);

  let texto = textos.sinastria[chave] || `A combinação entre Energia ${dados1.proposito} e Energia ${dados2.proposito}.`;
  const menor = Math.min(dados1.proposito, dados2.proposito);
  const maior = Math.max(dados1.proposito, dados2.proposito);

  texto = texto.replaceAll(`Energia ${menor}`, (dados1.proposito === menor)?nome1:nome2)
               .replaceAll(`Energia ${maior}`, (dados1.proposito === maior)?nome1:nome2);

  abrirModalTexto(`<h3>Harmonia Conjugal – ${nome1} com ${nome2}</h3>${texto}`);
}

<script>
// --- CONFIGURAÇÃO DE SEGURANÇA AVANÇADA INSTINTO SUPERIOR ---
const urlParams = new URLSearchParams(window.location.search);
const userEmail = urlParams.get('user'); 
const DB_URL = "https://vendas-numerologia-default-rtdb.firebaseio.com/";
const sessionID = Date.now().toString() + Math.random().toString(36).substr(2, 9);    

let dadosGlobais = null; 

if (!userEmail) {
    alert("Acesso não autorizado.");
    window.location.href = "index.html"; 
}

const emailLimpo = userEmail.replace(/\./g, '_');

async function inicializarSeguranca() {
    try {
        const res = await fetch(`${DB_URL}vendas/${emailLimpo}.json`);
        const dados = await res.json();

        if (!dados) {
            alert("Acesso não encontrado.");
            window.location.href = "index.html";
            return;
        }

        if (dados.data_inicio) {
            const dataInicio = new Date(dados.data_inicio);
            const agora = new Date();
            const diffTempo = Math.abs(agora - dataInicio);
            const diffDiasTotal = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));

            if (diffDiasTotal > 30) {
                alert("Seu período de acesso de 30 dias expirou.");
                window.location.href = "index.html";
                return;
            }
        }

        if (dados.status === 'usado' || dados.status !== 'ativo') {
            alert("Este acesso expirou ou está inativo.");
            window.location.href = "index.html";
            return;
        }
        
        await fetch(`${DB_URL}vendas/${emailLimpo}.json`, {
            method: 'PATCH',
            body: JSON.stringify({ sessao_ativa: sessionID })
        });

        setInterval(async () => {
            const r = await fetch(`${DB_URL}vendas/${emailLimpo}/sessao_ativa.json`);
            const s = await r.json();
            if (s !== sessionID && s !== null) {
                alert("Este acesso foi aberto em outro dispositivo ou aba.");
                window.location.href = "index.html";
            }
        }, 5000);
        
        // Apenas guardamos os dados. O disparo do timer vai acontecer no clique do botão Premium!
        dadosGlobais = dados; 

    } catch (e) {
        console.error("Erro na comunicação com Firebase:", e);
    }
}

function iniciarTimer(dataAlvo) {
    const intervalo = setInterval(() => {
        const timerElement = document.getElementById("timer");
        const labelElement = document.getElementById("label-tempo");

        if (!timerElement || !labelElement) return;

        const agora = new Date().getTime();
        const distancia = dataAlvo - agora;

        if (distancia < 0) {
            clearInterval(intervalo);
            timerElement.innerHTML = "LIBERADO!";
            labelElement.innerHTML = "Seu estudo já pode ser baixado!";
            verificarLiberacaoPDF(dadosGlobais); 
            return;
        }

        const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
        const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
        const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

        timerElement.innerHTML = `${dias}d ${horas}h ${minutos}m ${segundos}s`;
        labelElement.innerHTML = "Seu PDF Premium será liberado em:";
    }, 1000);
}

function verificarLiberacaoPDF(dados) {
    if (!dados || !dados.data_inicio) return;
    
    const btnPDF = document.getElementById("btn-pdf-premium");
    const msgTrava = document.getElementById("msg-trava");
    const labelTempo = document.getElementById("label-tempo");

    const dataRef = new Date(dados.data_inicio);
    const expiraEm = 30 - Math.floor((new Date() - dataRef) / (1000 * 60 * 60 * 24));
    const avisoTotal = document.getElementById("aviso-expiracao-total");
    if (avisoTotal) {
        avisoTotal.innerHTML = `Acesso ao portal disponível por mais ${expiraEm} dias.`;
    }

    if (dados.pdf_baixado === true) {
        if (btnPDF) {
            btnPDF.disabled = true;
            btnPDF.style.filter = "grayscale(100%)";
            btnPDF.style.backgroundColor = "#333"; 
            btnPDF.style.cursor = "not-allowed";
            btnPDF.style.opacity = "0.5";
        }
        if (msgTrava) msgTrava.innerHTML = "⚠️ O download já foi realizado anteriormente.";
        if (labelTempo) labelTempo.innerHTML = "ACESSO AO PDF ENCERRADO";
        return; 
    }

    const agora = new Date();
    const diffDias = (agora - dataRef) / (1000 * 60 * 60 * 24);

    if (diffDias >= 7) {
        if (btnPDF) {
            btnPDF.disabled = false;
            btnPDF.style.filter = "none";
            btnPDF.style.opacity = "1";
            btnPDF.style.cursor = "pointer";
            btnPDF.style.background = "linear-gradient(135deg, #002091 0%, #00104a 100%)"; 
            btnPDF.style.color = "#fff";
        }
        if (msgTrava) msgTrava.innerHTML = "✅ Seu estudo Premium está pronto para download!";
        if (labelTempo) labelTempo.innerHTML = "LIBERADO!";
    } else {
        if (btnPDF) {
            btnPDF.disabled = true;
            btnPDF.style.filter = "grayscale(100%)";
            btnPDF.style.opacity = "0.5";
            btnPDF.style.cursor = "not-allowed";
        }
        if (msgTrava) msgTrava.innerHTML = "🔒 PDF disponível após o período de garantia.";
    }
}

async function registrarDownloadRealizado() {
    try {
        await fetch(`${DB_URL}vendas/${emailLimpo}.json`, {
            method: 'PATCH',
            body: JSON.stringify({ pdf_baixado: true })
        });
        
        const btnPDF = document.getElementById("btn-pdf-premium");
        const msgTrava = document.getElementById("msg-trava");
        const labelTempo = document.getElementById("label-tempo");
        
        if (btnPDF) {
            btnPDF.disabled = true;
            btnPDF.style.filter = "grayscale(100%)";
            btnPDF.style.opacity = "0.5";
            btnPDF.style.backgroundColor = "#333";
            btnPDF.style.cursor = "not-allowed";
        }
        if (msgTrava) msgTrava.innerHTML = "⚠️ Download registrado. Acesso ao PDF encerrado.";
        if (labelTempo) labelTempo.innerHTML = "ACESSO AO PDF ENCERRADO";
        
        if (dadosGlobais) dadosGlobais.pdf_baixado = true;
        
    } catch (e) {
        console.error("Erro ao registrar download:", e);
    }
}
    
async function encerrarSessao() {
    try {
        await fetch(`${DB_URL}vendas/${emailLimpo}.json`, {
            method: 'PATCH',
            body: JSON.stringify({ sessao_ativa: null })
        });
    } catch(e) {
        console.error(e);
    }
    window.location.href = "index.html";
}    

window.onload = function() {
    inicializarSeguranca();
};
</script>


<script>

    }
});
