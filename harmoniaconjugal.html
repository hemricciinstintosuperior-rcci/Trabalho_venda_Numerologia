/* =======================================================
   BLINDAGEM E COMPACTAÇÃO DA PIRÂMIDE NA TELA (MODAL/CARD)
   ======================================================= */
.piramide {
    font-family: 'Courier New', monospace;
    
    /* Dynamic Font: Muda entre 0.85rem (nomes gigantes) até 1.2rem (nomes normais) automaticamente */
    font-size: clamp(0.85rem, 2vw, 1.2rem) !important;
    
    /* Junta as linhas verticalmente para a pirâmide não ficar espalhada */
    line-height: 1.2 !important;
    
    /* Compacta o espaço horizontal entre os números */
    letter-spacing: clamp(2px, 0.5vw, 5px) !important;
    
    margin: 15px 0;
    width: 100%;
    
    /* Mantém a estrutura exata de espaçamentos gerados pelo JS */
    white-space: pre !important;
    text-align: center;
    
    /* TRAVA DE ALTURA: Limita o tamanho na tela para nunca empurrar o resto da página */
    max-height: 320px;
    overflow-y: auto;
    overflow-x: hidden;
    
    /* Adiciona uma rolagem elegante e discreta caso o nome abuse do tamanho */
    scrollbar-width: thin;
    scrollbar-color: rgba(212, 154, 154, 0.3) transparent;
}

/* Customização da barra de rolagem interna da pirâmide para navegadores Webkit (Chrome/Edge/Safari) */
.piramide::-webkit-scrollbar {
    width: 6px;
}
.piramide::-webkit-scrollbar-thumb {
    background: rgba(212, 154, 154, 0.3);
    border-radius: 4px;
}

/* Força os cards que guardam as pirâmides a ficarem travados e elegantes */

    background: var(--card-bg);
    padding: 25px 15px;

    border: 1px solid rgba(255,255,255,0.05);

    display: flex;
    flex-direction: column;

    align-items: center;
    max-height: 480px; /* Garante que o bloco todo nunca estoure a tela */
    overflow: hidden;
}

<script>
function mascaraData(input) {
    let v = input.value.replace(/\D/g, '').slice(0, 8);
    if (v.length >= 5) {
        input.value = `${v.slice(0, 2)}/${v.slice(2, 4)}/${v.slice(4)}`;
    } else if (v.length >= 3) {
        input.value = `${v.slice(0, 2)}/${v.slice(2)}`;
    } else {
        input.value = v;
    }
}

const tabela = {
  A:1, J:1, I:1, Q:1, Y:1, B:2, K:2, R:2, C:3, G:3, L:3, S:3,
  D:4, M:4, T:4, E:5, H:5, N:5, U:6, V:6, W:6, X:6, Ç:6, O:7, Z:7, F:8, P:8
};

const vogais = ["A","E","I","O", "Y", "U"];

function calcularValorComAcentos(letra){
  const base = letra.normalize("NFD")[0];
  const valorBase = tabela[base];
  if(!valorBase) return 0;

  let soma = 0;
  let mult = 1;

  for(let c of letra.normalize("NFD")){
    if(c === "\u0301") soma += 2;
    else if(c === "\u0302") soma += 7;
    else if(c === "\u0303") soma += 3;
    else if(c === "\u0327") soma += 3;
    else if(c === "\u0300") mult *= 2;
    else if(c === "\u0308") mult *= 2;
  }
  return (valorBase + soma) * mult;
}

function reduzir(n, aceitaMestre = true) {

    if (n === null || n === undefined) return 0;

    let num = parseInt(String(n).replace(/\D/g, ""));

    if (isNaN(num)) return 0;

    // Mestres soberanos
    const mestres = [11,22,33,44,55,66,77,88,99];

    while (num > 9) {

        // PRESERVA MESTRES
        if (aceitaMestre && mestres.includes(num)) {
            break;
        }

        num = String(num)
            .split("")
            .reduce((a,b)=> a + Number(b), 0);
    }

    return num;
}



    

function calcularCVLinear(dia, mes, ano) {

    let dataCompleta =
        dia.toString() +
        mes.toString() +
        ano.toString();

    let somaTotal = 0;

    for (let i = 0; i < dataCompleta.length; i++) {

        let digito = parseInt(dataCompleta[i]);

        if (!isNaN(digito)) {
            somaTotal += digito;
        }
    }

    return reduzir(somaTotal);
}

// FUNÇÃO INTELIGENTE DE BUSCA DE TEXTOS POR GÊNERO
function obterTexto(modulo, numeroChave, genero) {
    // Se o gênero selecionado for feminino e a árvore feminina existir, busca nela
    if (genero === 'feminino' && window.textosFeminino && window.textosFeminino[modulo]) {
        return window.textosFeminino[modulo][numeroChave] || "";
    }
    
    // Caso contrário, recorre à árvore padrão/masculina atual
    if (window.textos && window.textos[modulo]) {
        return window.textos[modulo][numeroChave] || "";
    }
    
    return ""; // Retorna vazio se não encontrar nada
}
    

function calcularAnoPessoal(data){
  if(!data || data.length < 10) return 0;
  const [dia, mes, ano] = data.split("/").map(Number);
  const anoAtual = new Date().getFullYear();
  return reduzir(reduzir(dia) + reduzir(mes) + reduzir(anoAtual));
}  

let dados1 = null;
let dados2 = null;

function calcularPessoa(nome, data){
  nome = nome.toUpperCase();
  let somaV=0, somaC=0;
  let valores=[];

  for(let l of nome){
    const valor = calcularValorComAcentos(l);
    if(!valor) continue;
    valores.push(reduzir(valor));
    const base = l.normalize("NFD")[0];
    if(vogais.includes(base)) somaV += valor;
    else somaC += valor;
  }

  const motivacao = reduzir(somaV);
  const influencia = reduzir(somaC);
  const personality = reduzir(somaV+somaC);
  let caminho=0, proposito=0;

  if(data && data.length === 10){
    const [dia, mes, ano] = data.split("/").map(Number);
    caminho = calcularCVLinear(dia, mes, ano);
    proposito = reduzir(caminho+personality);
  }
  return { motivacao, influencia, personalidade: personality, caminho, proposito, harmonia: proposito, valores };
}

function gerarPiramide(valores, elementoPiramide, elementoRegente){
  let numerosSequencias = [];
  if(!valores || valores.length === 0){
    elementoPiramide.innerHTML=""; elementoRegente.innerHTML=""; return;
  }

  // 1. Criamos a primeira linha, já garantindo que tudo seja reduzido para 1 dígito
  let lines = [valores.map(n => reduzir(n, false))]; 

  while(lines[lines.length-1].length > 1){
    let anterior = lines[lines.length-1];
    let nova = [];
    for(let i=0; i<anterior.length-1; i++){
      // 2. A soma de dois números deve ser reduzida forçadamente (aceitaMestre = false)
      let soma = anterior[i] + anterior[i+1];
      nova.push(reduzir(soma, false)); 
    }
    lines.push(nova);
  }

  let marcacoes = [];
  for(let l=0; l<lines.length; l++){
    marcacoes[l] = new Set();
    let linha = lines[l];
    let i=0;
    while(i < linha.length){
      let atual = Number(linha[i]);
      let count = 1; let j = i+1;
      while(j < linha.length && Number(linha[j]) === atual) { count++; j++; }
      if(count >= 3){
        for(let k=i; k<i+count; k++) marcacoes[l].add(k);
      }
      i += count;
    }
  }

  let html="";
  for(let l=0; l<lines.length; l++){
    html += lines[l].map((n,idx)=>{
      if (marcacoes[l].has(idx)){
        if (!numerosSequencias.includes(n)) numerosSequencias.push(n);
        return `<span class="negativo">${n}</span>`;
      }
      return n;
    }).join(" ") + "<br>";
  }

  elementoPiramide.innerHTML = html;
  const regente = lines[lines.length - 1][0];

  // CORREÇÃO DOS TEXTOS DO MODAL AQUI:
  // Descobre qual objeto de texto usar baseado no id do elemento
  let textoParaPassar = "";
  if (elementoRegente.id === "regente1") {
    textoParaPassar = `textos.regente[${regente}]`;
  } else if (elementoRegente.id === "regente2") {
    textoParaPassar = `textosFeminino.regente[${regente}]`;
  } else if (elementoRegente.id === "regenteBebe") {
    // Aqui fazemos ele pegar do seu 'regentebb' lá do textos.js!
    textoParaPassar = `textos.regentebb[${regente}]`; 
  }

  elementoRegente.innerHTML = `
    <div class="botoes-piramide">
      <button onclick="abrirModalRegente(${textoParaPassar}, '${elementoRegente.id}')">Regente: ${regente}</button>
      <button onclick="mostrarSequenciaNegativa('${elementoRegente.id}')">Sequência Negativa</button>
    </div>
  `;

  // Mantendo a estrutura padrão de propriedades (.regente e .sequenciaNegativa) para o seu objeto dadosBebe funcionar redondo
  if (elementoRegente.id === "regente1") { dados1.regente = regente; dados1.sequenciaNegativa = numerosSequencias; }
  if (elementoRegente.id === "regente2") { dados2.regente = regente; dados2.sequenciaNegativa = numerosSequencias; }
  if (elementoRegente.id === "regenteBebe") { dadosBebe.regente = regente; dadosBebe.sequenciaNegativa = numerosSequencias; }

  if (elementoRegente.id === "regenteBebe") {
    const resultado = document.getElementById("resultadoBebe");
    resultado.innerHTML = (!numerosSequencias || numerosSequencias.length === 0) ? "✅ Este nome é harmônico." : "❌ Este nome possui sequência negativa.";
  }
}

    
function chaveSinastria(a,b){
  return `${Math.min(a,b)}-${Math.max(a,b)}`;
}

function mostrarSinastria(){

  if(!dados1 || !dados2) return;

  const nome1 = document.getElementById("nome1").value;
  const nome2 = document.getElementById("nome2").value;

  // PRIMEIRO NOME

  const social2 = document.getElementById("social2").value || nome2.split(' ')[0];

  const chave = chaveSinastria(
    dados1.proposito,
    dados2.proposito
  );

  let texto = textos.sinastria[chave] ||
  `A combinação entre [P1] e [P2].`;

  texto = processarTextoSinastria(
    texto,
    social1,
    social2
  );

  abrirModalTexto(`
    <h3>Harmonia Conjugal – ${social1} com ${social2}</h3>
    ${texto}
  `);
}


function aplicarGenero(texto){

  texto = texto.replace(
    /\{P1:(.*?)\|(.*?)\}/g,
    (_, masc, fem) => masc
  );

  texto = texto.replace(
    /\{P2:(.*?)\|(.*?)\}/g,
    (_, masc, fem) => fem
  );

  return texto;
}

    if (!texto) return "";
    return String(texto).replace(/MASCULINO-FEMININO-NEUTRO/gi, ` <strong>${nome}</strong> `).replace(/MASCULINO-FEMININO-NEUTRO/gi, ` <strong>${nome}</strong> `);
}

function abrirModal(tipo) {
  let textoBase = "", nomePessoa = "";

  if (tipo.includes("1")) {
    nomePessoa = document.getElementById("social1").value || document.getElementById("nome1").value;

function processarTextoSinastria(texto, nome1, nome2) {

  if (!texto) return "";

  texto = String(texto)

    // NOMES
    .replaceAll("[P1]", `<strong>${nome1}</strong>`)
    .replaceAll("[P2]", `<strong>${nome2}</strong>`)

    // FLEXÕES P1 = masculino
    .replace(/\{P1:([^|]+)\|([^}]+)\}/g, "$2")

    // FLEXÕES P2 = feminino
    .replace(/\{P2:([^|]+)\|([^}]+)\}/g, "$1");

  return texto;
}

        if (valorCabalistico > 9) {

            if (valorCabalistico > 9) valorCabalistico = Math.floor(valorCabalistico / 10) + (valorCabalistico % 10);

function obterHtmlTextoPiramide(valores) {
  if(!valores || valores.length === 0) return "";

  // 1. Forçamos a redução de cada valor inicial para um dígito (1-9)
  let lines = [valores.map(n => reduzir(n, false))];

  while(lines[lines.length-1].length > 1){

        const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
